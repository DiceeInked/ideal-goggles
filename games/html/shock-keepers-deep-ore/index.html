<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shock Keepers: Deep Ore</title>
    <style>
      :root {
        --bg: #0b1220;
        --panel: rgba(15, 20, 32, 0.85);
        --text: #e5f6ff;
        --muted: #9bb4c6;
        --blue: #62d6ff;
        --green: #7ef7b4;
        --yellow: #fbe26a;
        --red: #ff7a7a;
        --purple: #b990ff;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #070d15;
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
        overflow: hidden;
      }

      #game {
        display: block;
        width: 100vw;
        height: 100vh;
        background: linear-gradient(#101b2d, #080e17 55%, #05090d);
      }

      .hud {
        position: fixed;
        top: 14px;
        left: 14px;
        right: 14px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        pointer-events: none;
        z-index: 10;
      }

      .title {
        background: rgba(7, 13, 20, 0.74);
        border: 1px solid rgba(125, 211, 252, 0.7);
        border-radius: 12px;
        padding: 10px 18px;
        font-weight: bold;
        letter-spacing: 1px;
      }

      .stats {
        background: rgba(7, 13, 20, 0.74);
        border: 1px solid rgba(125, 211, 252, 0.7);
        border-radius: 12px;
        padding: 10px 16px;
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        font-size: 14px;
      }

      #panel {
        position: fixed;
        right: 18px;
        top: 92px;
        width: 260px;
        background: rgba(15, 20, 32, 0.85);
        border: 1px solid rgba(125, 211, 252, 0.6);
        border-radius: 14px;
        padding: 12px 14px;
        box-shadow: 0 0 18px rgba(0, 0, 0, 0.35);
        z-index: 12;
      }

      #panel h3 {
        margin: 0 0 10px;
        font-size: 18px;
      }

      .weapon-slot {
        margin-bottom: 10px;
      }

      .weapon-slot label {
        display: block;
        font-size: 12px;
        margin-bottom: 5px;
        color: var(--muted);
      }

      select {
        width: 100%;
        background: rgba(9, 17, 27, 0.95);
        color: var(--text);
        border: 1px solid rgba(125, 211, 252, 0.5);
        border-radius: 8px;
        padding: 8px 10px;
        font-size: 14px;
      }

      .info-box {
        margin-top: 12px;
        padding-top: 10px;
        border-top: 1px solid rgba(125, 211, 252, 0.5);
      }

      .info-box strong {
        display: block;
        margin-bottom: 6px;
        color: var(--blue);
      }

      .info-box p {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.55;
      }

      @media (max-width: 760px) {
        #panel {
          position: static;
          width: 100%;
          max-width: 360px;
          margin: 80px auto 10px;
        }

        .hud {
          flex-direction: column;
          align-items: flex-start;
          gap: 10px;
        }
      }
    </style>
  </head>
  <body>
    <div class="hud">
      <div class="title">Shock Keepers: Deep Ore</div>
      <div class="stats">
        <span id="healthStat">Health: 100</span>
        <span id="inkStat">Ink: 32</span>
        <span id="shardsStat">Shards: 0</span>
        <span id="depthStat">Level: A99</span>
      </div>
    </div>

    <aside id="panel">
      <h3>Weapon Loadout</h3>

      <div class="weapon-slot">
        <label for="bladeSelect">Blade</label>
        <select id="bladeSelect">
          <option value="breaker">Breaker Edge</option>
          <option value="steady">Steady Blade</option>
          <option value="rift">Rift Cutter</option>
        </select>
      </div>

      <div class="weapon-slot">
        <label for="handleSelect">Handle</label>
        <select id="handleSelect">
          <option value="shock">Shock Grip</option>
          <option value="hook">Hook Tether</option>
          <option value="lunge">Arc Lunge</option>
        </select>
      </div>

      <div class="weapon-slot">
        <label for="amuletSelect">Amulet</label>
        <select id="amuletSelect">
          <option value="pulse">Pulse Lens</option>
          <option value="core">Core Sigil</option>
          <option value="glow">Glow Charm</option>
        </select>
      </div>

      <div class="info-box">
        <strong>Controls</strong>
        <p>Move with A/D or arrow keys. Jump with W/Up. Press J or Space to mine. Press E for a shock burst. Reach the stronghold to descend deeper.</p>
      </div>
    </aside>

    <canvas id="game" width="1280" height="720"></canvas>

    <script>
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const bladeSelect = document.getElementById('bladeSelect');
      const handleSelect = document.getElementById('handleSelect');
      const amuletSelect = document.getElementById('amuletSelect');
      const healthStat = document.getElementById('healthStat');
      const inkStat = document.getElementById('inkStat');
      const shardsStat = document.getElementById('shardsStat');
      const depthStat = document.getElementById('depthStat');

      const keys = {};
      const pointer = { down: false, x: 0, y: 0 };

      const weaponProfiles = {
        breaker: { label: 'Breaker Edge', damage: 18, mining: 1.4 },
        steady: { label: 'Steady Blade', damage: 14, mining: 1.1 },
        rift: { label: 'Rift Cutter', damage: 22, mining: 1.7 },
        shock: { label: 'Shock Grip', pulse: 28, radius: 140 },
        hook: { label: 'Hook Tether', pulse: 22, radius: 160 },
        lunge: { label: 'Arc Lunge', pulse: 32, radius: 120 },
        pulse: { label: 'Pulse Lens', bonus: 0.20 },
        core: { label: 'Core Sigil', bonus: 0.35 },
        glow: { label: 'Glow Charm', bonus: 0.25 }
      };

      const state = {
        cameraX: 0,
        player: {
          x: 90,
          y: 520,
          w: 26,
          h: 38,
          vx: 0,
          vy: 0,
          speed: 260,
          jumpPower: 550,
          onGround: false,
          health: 100,
          maxHealth: 100,
          ink: 32,
          shards: 0,
          depth: 99,
          hitFlash: 0,
          facing: 1,
          miningCooldown: 0,
          abilityCooldown: 0
        },
        level: null,
        ores: [],
        keepers: [],
        particles: [],
        stateText: 'The first cave is quiet. Mine the ore and find the stronghold.',
        gameOver: false
      };

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function rand(min, max) {
        return Math.random() * (max - min) + min;
      }

      function levelName(depth) {
        const letter = String.fromCharCode(65 + Math.floor(depth / 100));
        const floor = (depth % 100).toString().padStart(2, '0');
        return `${letter}${floor}`;
      }

      function generateLevel(depth) {
        const worldWidth = 1600 + depth * 120;
        const groundY = 620;
        const platforms = [
          { x: 0, y: groundY, w: 360, h: 110 },
          { x: 430, y: 570, w: 240, h: 80 },
          { x: 760, y: 520, w: 230, h: 80 },
          { x: 1060, y: 470, w: 220, h: 80 },
          { x: 1320, y: 420, w: 240, h: 90 },
          { x: 1560, y: 350, w: 220, h: 80 }
        ];

        const stronghold = {
          x: worldWidth - 120,
          y: 250,
          w: 70,
          h: 120,
          active: false
        };

        const ores = [];
        for (let i = 0; i < 7 + depth; i += 1) {
          const platform = platforms[Math.floor(Math.random() * platforms.length)];
          ores.push({
            x: platform.x + rand(24, platform.w - 24),
            y: platform.y - 18,
            radius: 12 + Math.random() * 8,
            hp: 28 + Math.random() * 18,
            color: ['#ff7a7a', '#62d6ff', '#7ef7b4', '#fbe26a'][i % 4],
            value: 8 + Math.random() * 12,
            mineral: true
          });
        }

        const keepers = [];
        const keeperCount = 2 + Math.min(5, Math.floor(depth / 25));
        for (let i = 0; i < keeperCount; i += 1) {
          const platform = platforms[Math.floor(Math.random() * platforms.length)];
          keepers.push({
            x: platform.x + rand(40, platform.w - 40),
            y: platform.y - 22,
            w: 22,
            h: 38,
            vx: 30 + Math.random() * 40,
            hp: 60 + depth * 2,
            touchCooldown: rand(0.6, 1.5),
            dir: Math.random() > 0.5 ? 1 : -1,
            color: '#b990ff'
          });
        }

        state.level = {
          name: levelName(depth),
          width: worldWidth,
          platforms,
          stronghold,
          ores,
          keepers
        };

        state.player.x = 90;
        state.player.y = 400;
        state.player.vx = 0;
        state.player.vy = 0;
        state.cameraX = 0;
        state.stateText = `Level ${levelName(depth)}: mine the ore and activate the stronghold.`;
      }

      function applyWeaponStats() {
        const blade = weaponProfiles[bladeSelect.value];
        const handle = weaponProfiles[handleSelect.value];
        const amulet = weaponProfiles[amuletSelect.value];

        state.player.attackDamage = blade.damage || 16;
        state.player.miningPower = blade.mining || 1.2;
        state.player.shockRadius = handle.radius || 150;
        state.player.shockDamage = handle.pulse || 26;
        state.player.miningAmp = 1 + (amulet.bonus || 0);
      }

      function updateStats() {
        healthStat.textContent = `Health: ${Math.max(0, Math.ceil(state.player.health))}`;
        inkStat.textContent = `Ink: ${Math.max(0, Math.ceil(state.player.ink))}`;
        shardsStat.textContent = `Shards: ${Math.floor(state.player.shards)}`;
        depthStat.textContent = `Level: ${state.level ? state.level.name : 'A99'}`;
      }

      function rectsOverlap(a, b) {
        return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
      }

      function mineOre() {
        if (state.player.miningCooldown > 0 || state.player.ink <= 0 || state.gameOver) return;

        const blade = weaponProfiles[bladeSelect.value];
        const amulet = weaponProfiles[amuletSelect.value];

        let target = null;
        for (const ore of state.level.ores) {
          const dx = Math.abs(ore.x - state.player.x);
          const dy = Math.abs(ore.y - state.player.y);
          const inRange = dx < 72 && dy < 56;
          if (inRange && (!target || dx < Math.abs(target.x - state.player.x))) {
            target = ore;
          }
        }

        if (!target) {
          state.stateText = 'No ore in reach. Move closer to the vein.';
          return;
        }

        const miningPower = blade.mining || 1.2;
        const inkCost = 0.9 + (amulet.bonus || 0) * 1.2;
        const damage = 10 * miningPower * state.player.miningAmp;

        target.hp -= damage;
        state.player.ink -= inkCost;
        state.player.miningCooldown = 0.18;

        state.particles.push({
          x: target.x,
          y: target.y,
          color: target.color,
          radius: 4,
          life: 0.35,
          vx: rand(-40, 40),
          vy: rand(-30, 20)
        });

        if (target.hp <= 0) {
          state.player.shards += 4 + Math.random() * 5;
          state.player.ink += 6 + Math.random() * 8;
          state.stateText = 'Ore shattered. You recovered ink and shards.';
          state.level.ores = state.level.ores.filter((ore) => ore !== target);
        }
      }

      function shockPulse() {
        if (state.player.abilityCooldown > 0 || state.player.ink < 8 || state.gameOver) return;

        const handle = weaponProfiles[handleSelect.value];
        const amulet = weaponProfiles[amuletSelect.value];
        const cost = 8 + (amulet.bonus || 0) * 12;

        if (state.player.ink < cost) {
          state.stateText = 'Not enough ink for the shock burst.';
          return;
        }

        state.player.ink -= cost;
        state.player.abilityCooldown = 1.4;

        for (const keeper of state.level.keepers) {
          const dx = keeper.x - state.player.x;
          const dy = keeper.y - state.player.y;
          const dist = Math.hypot(dx, dy);
          if (dist < (handle.radius || 150)) {
            keeper.hp -= state.player.shockDamage || 26;
            keeper.x += dx * 0.12;
            keeper.y += dy * 0.12;
            state.stateText = 'Shock pulse hit a keeper.';
          }
        }

        state.level.keepers = state.level.keepers.filter((keeper) => {
          if (keeper.hp <= 0) {
            state.player.shards += 10;
            state.player.ink += 12;
            return false;
          }
          return true;
        });

        state.particles.push({
          x: state.player.x,
          y: state.player.y,
          color: '#62d6ff',
          radius: 16,
          life: 0.5,
          vx: 0,
          vy: 0,
          ring: true
        });
      }

      function collisionPlayerPlatforms(player, platforms) {
        let grounded = false;
        for (const p of platforms) {
          const prevBottom = player.y + player.h - player.vy * 0.016;
          const nextBottom = player.y + player.h;

          const overlapX = player.x + player.w > p.x && player.x < p.x + p.w;
          const onTop = player.y + player.h <= p.y + 16 && prevBottom >= p.y && nextBottom >= p.y;

          if (overlapX && onTop && player.vy >= 0) {
            player.y = p.y - player.h;
            player.vy = 0;
            player.onGround = true;
            grounded = true;
          }
        }

        if (!grounded) player.onGround = false;
      }

      function updatePlayer(dt) {
        const player = state.player;
        const moveDir = (keys['d'] || keys['arrowright'] ? 1 : 0) - (keys['a'] || keys['arrowleft'] ? 1 : 0);

        player.vx = moveDir * player.speed;
        player.vy += 1700 * dt;

        if ((keys['w'] || keys['arrowup']) && player.onGround) {
          player.vy = -player.jumpPower;
          player.onGround = false;
        }

        if (moveDir !== 0) {
          player.facing = moveDir;
        }

        if (keys['j'] || keys[' '] || pointer.down) {
          mineOre();
        }

        if (keys['e'] && !keys['ePressed']) {
          shockPulse();
          keys['ePressed'] = true;
        }

        if (!keys['e']) keys['ePressed'] = false;

        player.x += player.vx * dt;
        player.y += player.vy * dt;

        player.onGround = false;
        collisionPlayerPlatforms(player, state.level.platforms);

        if (player.x < 40) player.x = 40;
        if (player.x + player.w > state.level.width - 40) player.x = state.level.width - 40 - player.w;

        if (player.y > canvas.height + 200) {
          player.health = 100;
          player.ink = 24;
          state.stateText = 'You fell. The cave resets you at the start of the level.';
          player.x = 90;
          player.y = 400;
          player.vy = 0;
        }

        player.abilityCooldown = Math.max(0, player.abilityCooldown - dt);
        player.miningCooldown = Math.max(0, player.miningCooldown - dt);
        player.hitFlash = Math.max(0, player.hitFlash - dt);

        state.cameraX = clamp(player.x - canvas.width * 0.4, 0, state.level.width - canvas.width);
      }

      function updateKeepers(dt) {
        const player = state.player;
        for (const keeper of state.level.keepers) {
          keeper.x += keeper.vx * dt * keeper.dir;

          if (keeper.x < 80 || keeper.x > state.level.width - 120) {
            keeper.dir *= -1;
            keeper.x = clamp(keeper.x, 80, state.level.width - 120);
          }

          keeper.touchCooldown -= dt;

          const dx = player.x - keeper.x;
          const dy = player.y - keeper.y;
          const dist = Math.hypot(dx, dy);

          if (dist < 52 && keeper.touchCooldown <= 0) {
            player.health -= 12;
            keeper.touchCooldown = 1.1;
            player.hitFlash = 0.3;
            state.stateText = 'A shock keeper hit you. Keep moving and use the shock pulse.';
          }
        }

        if (player.health <= 0) {
          player.health = player.maxHealth;
          player.ink = 24;
          player.shards = Math.max(0, player.shards - 8);
          state.stateText = 'You were downed by the mine. Respawning at the start of the level.';
          player.x = 90;
          player.y = 400;
          player.vy = 0;
        }
      }

      function updateStronghold() {
        const { stronghold } = state.level;
        const player = state.player;

        const insideStronghold =
          player.x + player.w > stronghold.x &&
          player.x < stronghold.x + stronghold.w &&
          player.y + player.h > stronghold.y &&
          player.y < stronghold.y + stronghold.h;

        if (insideStronghold) {
          state.player.depth += 1;
          const nextDepth = state.player.depth;
          const levelDepth = nextDepth;
          const strongholdText = `Stronghold activated. Descending into ${levelName(levelDepth)}.`;
          state.stateText = strongholdText;
          generateLevel(levelDepth);
        }
      }

      function updateParticles(dt) {
        state.particles = state.particles.filter((p) => {
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.life -= dt;
          return p.life > 0;
        });
      }

      function update(dt) {
        if (!state.level) return;

        updatePlayer(dt);
        updateKeepers(dt);
        updateStronghold();
        updateParticles(dt);

        state.player.ink = Math.min(state.player.ink + dt * 0.8, 90);
        state.player.health = clamp(state.player.health + dt * 0.45, 0, state.player.maxHealth);
        applyWeaponStats();
        updateStats();
      }

      function drawBackground() {
        const g = ctx.createLinearGradient(0, 0, 0, canvas.height);
        g.addColorStop(0, '#111d2d');
        g.addColorStop(0.4, '#0b1625');
        g.addColorStop(1, '#070d15');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = 'rgba(125, 211, 252, 0.05)';
        for (let i = 0; i < 32; i += 1) {
          const x = (i * 67) - (state.cameraX * 0.15) % 80;
          const y = (i * 93) % canvas.height;
          ctx.fillRect(x, y, 20, 16);
        }
      }

      function drawPlatforms() {
        ctx.save();
        ctx.translate(-state.cameraX, 0);

        for (const platform of state.level.platforms) {
          ctx.fillStyle = '#2b3d52';
          ctx.fillRect(platform.x, platform.y, platform.w, platform.h);
          ctx.fillStyle = '#425d7a';
          ctx.fillRect(platform.x, platform.y, platform.w, 10);
        }

        const stronghold = state.level.stronghold;
        ctx.fillStyle = '#7dd3fc';
        ctx.fillRect(stronghold.x, stronghold.y, stronghold.w, stronghold.h);
        ctx.fillStyle = '#dff9ff';
        ctx.fillRect(stronghold.x + 12, stronghold.y + 18, stronghold.w - 24, stronghold.h - 32);

        for (const ore of state.level.ores) {
          ctx.beginPath();
          ctx.fillStyle = ore.color;
          ctx.shadowBlur = 18;
          ctx.shadowColor = ore.color;
          ctx.arc(ore.x, ore.y, ore.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowBlur = 0;
        }

        for (const keeper of state.level.keepers) {
          ctx.fillStyle = '#b990ff';
          ctx.fillRect(keeper.x - 10, keeper.y - 18, 22, 38);
          ctx.fillStyle = '#d7d4ff';
          ctx.fillRect(keeper.x - 4, keeper.y - 12, 8, 20);
        }

        ctx.restore();
      }

      function drawPlayer() {
        const player = state.player;
        const screenX = player.x - state.cameraX;

        ctx.fillStyle = player.hitFlash > 0 ? '#f0fbff' : '#7ef7b4';
        ctx.fillRect(screenX, player.y, player.w, player.h);

        ctx.fillStyle = '#dff9ff';
        ctx.fillRect(screenX + (player.facing > 0 ? player.w : -8), player.y + 6, 8, 8);

        ctx.strokeStyle = 'rgba(255,255,255,0.8)';
        ctx.lineWidth = 2;
        ctx.strokeRect(screenX, player.y, player.w, player.h);
      }

      function drawParticles() {
        for (const p of state.particles) {
          const x = p.x - state.cameraX;
          ctx.beginPath();
          if (p.ring) {
            ctx.strokeStyle = p.color;
            ctx.lineWidth = 3;
            ctx.arc(x, p.y, p.radius, 0, Math.PI * 2);
            ctx.stroke();
          } else {
            ctx.fillStyle = p.color;
            ctx.arc(x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      function drawHudText() {
        ctx.fillStyle = 'rgba(7, 13, 20, 0.7)';
        ctx.fillRect(20, canvas.height - 70, canvas.width - 40, 44);

        ctx.fillStyle = '#e5f6ff';
        ctx.font = '18px Arial';
        ctx.fillText(state.stateText, 36, canvas.height - 40);
      }

      function draw() {
        drawBackground();
        drawPlatforms();
        drawParticles();
        drawPlayer();
        drawHudText();
      }

      function loop(now) {
        const dt = Math.min((now - (loop.last || now)) / 1000, 0.033);
        loop.last = now;

        update(dt);
        draw();
        requestAnimationFrame(loop);
      }

      function attachEvents() {
        window.addEventListener('keydown', (event) => {
          const key = event.key.toLowerCase();
          keys[key] = true;
          if (key === ' ') event.preventDefault();
        });

        window.addEventListener('keyup', (event) => {
          keys[event.key.toLowerCase()] = false;
        });

        bladeSelect.addEventListener('change', applyWeaponStats);
        handleSelect.addEventListener('change', applyWeaponStats);
        amuletSelect.addEventListener('change', applyWeaponStats);
      }

      function init() {
        attachEvents();
        applyWeaponStats();
        generateLevel(99);
        updateStats();
        requestAnimationFrame(loop);
      }

      init();
    </script>
  </body>
</html>
