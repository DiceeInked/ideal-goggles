name: Build Bedrock Add-on Packs

on:
  push:
    branches:
      - feature/bedrock-dynamic-economy
    paths:
      - "mods/dynamic-economy/bedrock/**"
      - "mods/recovery-compass/bedrock/**"
      - ".github/workflows/build-dynamic-economy-pack.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate source and package .mcpack
        shell: bash
        run: |
          set -euo pipefail
          set -euo pipefail

          package_pack() {
            SRC="$1"
            PREFIX="$2"
            OUTDIR="$SRC/releases"
            mkdir -p "$OUTDIR"
            VERSION="$(python3 - "$SRC/manifest.json" <<'PY'
          import json, sys
          from pathlib import Path
          manifest = json.loads(Path(sys.argv[1]).read_text())
          assert manifest.get("format_version") == 2, "Unexpected manifest format"
          assert any(m.get("type") == "script" for m in manifest.get("modules", [])), "Script module missing"
          version = ".".join(str(x) for x in manifest["header"]["version"])
          print(version)
          PY
          )"
            OUT="$OUTDIR/${PREFIX}_${VERSION}.mcpack"
            cp "$SRC/scripts/main.js" "$RUNNER_TEMP/${PREFIX}.mjs"
            node --check "$RUNNER_TEMP/${PREFIX}.mjs"
            rm -f "$OUT"
            (
              cd "$SRC"
              zip -q -X "$GITHUB_WORKSPACE/$OUT" manifest.json scripts/main.js
              if [ -f pack_icon.png ]; then
                zip -q -X -u "$GITHUB_WORKSPACE/$OUT" pack_icon.png
              fi
            )
            unzip -t "$OUT"
            echo "Built $OUT"
          }
          package_pack "mods/dynamic-economy/bedrock" "DynamicEconomy_Bedrock"
          package_pack "mods/recovery-compass/bedrock" "RecoveryCompass_Bedrock"

      - name: Commit generated pack when changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mods/dynamic-economy/bedrock/releases/*.mcpack mods/recovery-compass/bedrock/releases/*.mcpack
          if git diff --cached --quiet; then
            echo "No generated pack changes to commit."
            exit 0
          fi
          git commit -m "Build Dynamic Economy Bedrock pack from source"
          git push
