name: Validate Lattice of Greed pack

on:
  push:
    paths:
      - "mods/lattice-of-greed/full-version/**"
      - ".github/workflows/validate-lattice-pack.yml"
  pull_request:
    paths:
      - "mods/lattice-of-greed/full-version/**"
      - ".github/workflows/validate-lattice-pack.yml"

permissions:
  contents: write

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        run: node --input-type=module --check < mods/lattice-of-greed/full-version/scripts/main.js

      - name: Validate minimal pack
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = 'mods/lattice-of-greed/full-version';
          const manifest = JSON.parse(fs.readFileSync(path.join(root, 'manifest.json'), 'utf8'));
          if (manifest.format_version !== 2) throw new Error('Unexpected manifest format');
          if (manifest.header.version.join('.') !== '1.0.9') throw new Error('Expected release 1.0.9');
          if (manifest.modules[0].version.join('.') !== '1.0.9') throw new Error('Header/module versions differ');
          if (manifest.header.uuid === manifest.modules[0].uuid) throw new Error('Header and module UUIDs must differ');
          if (manifest.dependencies[0].module_name !== '@minecraft/server' || manifest.dependencies[0].version !== '2.8.0') {
            throw new Error('Unexpected Script API dependency');
          }
          const expected = ['function_check.mcfunction', 'lattice_recheck.mcfunction', 'lattice_status.mcfunction'];
          const actual = fs.readdirSync(path.join(root, 'functions')).filter(name => name.endsWith('.mcfunction')).sort();
          if (JSON.stringify(actual) !== JSON.stringify(expected)) throw new Error('Unexpected function files: ' + actual.join(', '));
          const script = fs.readFileSync(path.join(root, 'scripts/main.js'), 'utf8');
          for (const required of [
            'registerCustomDimension(DIMENSION_ID)',
            'function addLatticeTasks',
            'function addTreeTasks',
            'BLOCKS_PER_TICK',
            'function queueRegion',
            'system.afterEvents.scriptEventReceive.subscribe',
            'minecraft:bedrock',
            'minecraft:oak_log',
            'minecraft:oak_leaves'
          ]) if (!script.includes(required)) throw new Error('Missing expected code: ' + required);
          for (const removed of [
            'enqueueTowerSlices',
            'generateDreamRegion',
            'enqueueTesseract',
            'moveSerpent',
            'acquireRegionTickingArea'
          ]) if (script.includes(removed)) throw new Error('Unrelated old system remains: ' + removed);
          console.log('Minimal lattice + tree source validated.');
          NODE

      - name: Package current release
        run: |
          python3 - <<'PY'
          import json, zipfile
          from pathlib import Path
          root = Path('mods/lattice-of-greed/full-version')
          manifest = json.loads((root / 'manifest.json').read_text())
          version = '.'.join(map(str, manifest['header']['version']))
          package = root / f'Lattice-of-Greed-Full-{version}.mcpack'
          functions = sorted((root / 'functions').glob('*.mcfunction'))
          with zipfile.ZipFile(package, 'w', compression=zipfile.ZIP_DEFLATED) as z:
              z.write(root / 'manifest.json', 'manifest.json')
              z.write(root / 'README.md', 'README.md')
              z.write(root / 'scripts' / 'main.js', 'scripts/main.js')
              for function_file in functions:
                  z.write(function_file, f'functions/{function_file.name}')
          print(f'Built {package} ({package.stat().st_size} bytes; {len(functions)} functions)')
          PY

      - name: Commit refreshed package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A mods/lattice-of-greed/full-version/
          if git diff --cached --quiet; then
            echo "Package already matches source."
          else
            git commit -m "Build Lattice of Greed behavior pack"
            git push
          fi

      - name: Verify importable mcpack archive
        run: |
          python3 - <<'PY'
          import json, zipfile
          from pathlib import Path
          root = Path('mods/lattice-of-greed/full-version')
          manifest = json.loads((root / 'manifest.json').read_text())
          version = '.'.join(map(str, manifest['header']['version']))
          pack = root / f'Lattice-of-Greed-Full-{version}.mcpack'
          assert pack.is_file(), f'Missing {pack.name}'
          with zipfile.ZipFile(pack) as z:
              names = set(z.namelist())
              expected = {
                  'manifest.json', 'README.md', 'scripts/main.js',
                  'functions/function_check.mcfunction',
                  'functions/lattice_recheck.mcfunction',
                  'functions/lattice_status.mcfunction'
              }
              assert expected == names, f'Unexpected archive contents: {sorted(names)}'
              assert z.read('manifest.json') == (root / 'manifest.json').read_bytes(), 'Manifest is stale'
              assert z.read('README.md') == (root / 'README.md').read_bytes(), 'README is stale'
              assert z.read('scripts/main.js') == (root / 'scripts/main.js').read_bytes(), 'Script is stale'
              assert manifest['header']['version'] == [1, 0, 9]
              print(f'Archive OK: {pack.stat().st_size} bytes; {len(names)} entries.')
          PY
