<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drawing Adventure: Mining Run</title>
  <style>
    :root {
      --bg: #0b1015;
      --bg-2: #111c24;
      --panel: rgba(16, 22, 28, 0.88);
      --panel-strong: rgba(20, 28, 35, 0.96);
      --line: rgba(177, 196, 210, 0.14);
      --line-strong: rgba(177, 196, 210, 0.22);
      --text: #edf6ff;
      --muted: #aabcc9;
      --soft: #dfeaf5;
      --gold: #e3c17c;
      --gold-soft: #f5d99a;
      --blue: #7cc9ff;
      --blue-soft: rgba(124, 201, 255, 0.18);
      --green: #8fe7bb;
      --rose: #f2b6ca;
      --shadow: rgba(0, 0, 0, 0.36);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(circle at top, rgba(124, 201, 255, 0.11), transparent 32%),
        linear-gradient(180deg, var(--bg), var(--bg-2));
      color: var(--text);
      font-family: Inter, "Segoe UI", sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .shell {
      width: min(1320px, calc(100vw - 22px));
      height: min(94vh, 820px);
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      border: 1px solid var(--line);
      background: var(--panel);
      box-shadow: 0 24px 60px var(--shadow);
      border-radius: 22px;
      overflow: hidden;
      backdrop-filter: blur(12px);
    }

    .sidebar {
      position: relative;
      background: linear-gradient(180deg, rgba(16,22,28,0.94), rgba(12,17,23,0.98));
      border-right: 1px solid var(--line);
      padding: 20px 18px 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .sidebar::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(124,201,255,0.04), transparent 30%, rgba(227,193,124,0.04));
      pointer-events: none;
    }

    .brand {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.74rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .brand-mark {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), var(--blue));
      box-shadow: 0 0 16px rgba(124,201,255,0.5);
      position: relative;
    }

    .brand-mark::after {
      content: "";
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      border: 1px solid rgba(124,201,255,0.26);
    }

    .panel {
      position: relative;
      z-index: 1;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 14px 14px 12px;
    }

    h1 {
      margin: 0;
      font-size: 1.18rem;
      letter-spacing: -0.04em;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 10px;
    }

    .stat {
      background: rgba(255,255,255,0.015);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 10px 8px;
    }

    .stat .label {
      display: block;
      font-size: 0.64rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .stat .value {
      font-size: 1.32rem;
      letter-spacing: -0.04em;
      font-weight: 700;
    }

    .objective {
      margin-top: 8px;
      font-size: 0.82rem;
      line-height: 1.6;
      color: var(--muted);
    }

    .bars {
      display: grid;
      gap: 10px;
      margin-top: 4px;
    }

    .bar-wrap {
      display: grid;
      gap: 6px;
    }

    .bar-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.66rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .meter {
      position: relative;
      width: 100%;
      height: 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--line);
      overflow: hidden;
    }

    .meter > span {
      position: absolute;
      inset: 0 auto 0 0;
      border-radius: inherit;
      width: 50%;
      background: linear-gradient(90deg, var(--gold), var(--rose));
      box-shadow: inset 0 0 12px rgba(255,255,255,0.12);
    }

    .meter.ink > span {
      background: linear-gradient(90deg, var(--blue), var(--green));
    }

    .controls {
      position: relative;
      z-index: 1;
      margin-top: auto;
      padding: 12px 12px 10px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255,255,255,0.015);
    }

    .controls h2 {
      margin: 0 0 10px;
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--gold);
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .key {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 7px 8px;
    }

    .key kbd {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 26px;
      height: 22px;
      padding: 0 6px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: rgba(255,255,255,0.02);
      color: var(--text);
      font: inherit;
      font-weight: 700;
      font-size: 0.72rem;
    }

    .game-panel {
      position: relative;
      display: flex;
      flex-direction: column;
      background: linear-gradient(180deg, rgba(13,18,24,0.92), rgba(11,14,18,0.96));
      padding: 10px;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: linear-gradient(180deg, #0d1419 0%, #101a22 38%, #0d1318 100%);
      box-shadow: inset 0 0 38px rgba(0,0,0,0.2);
    }

    .message {
      position: absolute;
      left: 20px;
      bottom: 18px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(13,17,21,0.76);
      font-size: 0.77rem;
      color: var(--soft);
      letter-spacing: 0.04em;
      max-width: 440px;
      backdrop-filter: blur(6px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    @media (max-width: 980px) {
      .shell {
        grid-template-columns: 1fr;
        height: auto;
      }
      .sidebar {
        border-right: none;
        border-bottom: 1px solid var(--line);
      }
      .game-panel {
        min-height: 60vh;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark"></span>
        <span>Drawing Adventure</span>
      </div>

      <div class="panel">
        <h1>Mining Run</h1>
        <div class="stats">
          <div class="stat">
            <span class="label">Depth</span>
            <span class="value" id="depthValue">1</span>
          </div>
          <div class="stat">
            <span class="label">Shards</span>
            <span class="value" id="shardsValue">0</span>
          </div>
          <div class="stat">
            <span class="label">Ore</span>
            <span class="value" id="oreValue">0</span>
          </div>
          <div class="stat">
            <span class="label">Ink</span>
            <span class="value" id="inkValue">100</span>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="bars">
          <div class="bar-wrap">
            <div class="bar-head">
              <span>Objective</span>
              <span id="progressText">0 / 18</span>
            </div>
            <div class="meter"><span id="progressMeter" style="width:0%"></span></div>
          </div>
          <div class="bar-wrap">
            <div class="bar-head">
              <span>Ink</span>
              <span id="inkText">100%</span>
            </div>
            <div class="meter ink"><span id="inkMeter" style="width:100%"></span></div>
          </div>
        </div>

        <p class="objective" id="objectiveText">
          Collect 18 ore. Return to the camp portal to reinforce your loadout and descend deeper.
        </p>
      </div>

      <div class="controls">
        <h2>Controls</h2>
        <div class="keys">
          <div class="key"><kbd>WASD</kbd><span>Move</span></div>
          <div class="key"><kbd>E</kbd><span>Mine</span></div>
          <div class="key"><kbd>Q</kbd><span>Draw</span></div>
          <div class="key"><kbd>F</kbd><span>Camp</span></div>
        </div>
      </div>
    </aside>

    <main class="game-panel">
      <canvas id="gameCanvas" width="1040" height="760"></canvas>
      <div class="message" id="messageBox">The camp is safe. Mine a bit, draw a mark, then descend.</div>
    </main>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const ui = {
      depth: document.getElementById('depthValue'),
      shards: document.getElementById('shardsValue'),
      ore: document.getElementById('oreValue'),
      ink: document.getElementById('inkValue'),
      objective: document.getElementById('objectiveText'),
      progressText: document.getElementById('progressText'),
      progressMeter: document.getElementById('progressMeter'),
      inkText: document.getElementById('inkText'),
      inkMeter: document.getElementById('inkMeter'),
      message: document.getElementById('messageBox')
    };

    const state = {
      worldWidth: 2400,
      worldHeight: 1800,
      depth: 1,
      oreGoal: 18,
      oreCollected: 0,
      shards: 0,
      ink: 100,
      camera: { x: 0, y: 0 },
      player: {
        x: 260,
        y: 260,
        vx: 0,
        vy: 0,
        radius: 14,
        speed: 2.5,
        drawCooldown: 0,
        mineCooldown: 0,
      },
      camp: { x: 260, y: 290, r: 120 },
      portal: { x: 1830, y: 1430, r: 82, active: false },
      rocks: [],
      particles: [],
      marks: [],
      keys: {}
    };

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function rand(min, max) {
      return Math.random() * (max - min) + min;
    }

    function dist(ax, ay, bx, by) {
      return Math.hypot(ax - bx, ay - by);
    }

    function addParticles(x, y, color, count = 12, speed = 1.3) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const v = rand(0.6, speed + 1.2);
        state.particles.push({
          x, y,
          vx: Math.cos(angle) * v,
          vy: Math.sin(angle) * v,
          r: rand(2, 5),
          life: rand(25, 52),
          color
        });
      }
    }

    function addMark(x, y, color) {
      state.marks.push({
        x, y,
        color,
        life: 70,
        radius: rand(16, 28)
      });
    }

    function generateRocks() {
      const oreTypes = [
        { name: 'copper', color: '#7cc9ff', value: 1, hp: 2 },
        { name: 'iron', color: '#ddedf5', value: 2, hp: 3 },
        { name: 'amber', color: '#e3c17c', value: 3, hp: 4 },
        { name: 'crystal', color: '#8fe7bb', value: 4, hp: 5 }
      ];

      const rocks = [];
      const safeRadius = 190;

      for (let i = 0; i < 120; i++) {
        let placed = false;
        for (let tries = 0; tries < 35; tries++) {
          const x = rand(80, state.worldWidth - 80);
          const y = rand(80, state.worldHeight - 80);
          if (dist(x, y, state.camp.x, state.camp.y) < safeRadius) continue;
          const type = oreTypes[Math.floor(Math.random() * oreTypes.length)];
          rocks.push({
            x,
            y,
            r: rand(20, 33),
            type: type.name,
            color: type.color,
            value: type.value,
            hp: type.hp,
            maxHp: type.hp,
            glow: rand(0.8, 1.5)
          });
          placed = true;
          break;
        }
        if (!placed) break;
      }

      return rocks;
    }

    function updateHud() {
      ui.depth.textContent = String(state.depth);
      ui.shards.textContent = String(state.shards);
      ui.ore.textContent = String(state.oreCollected);
      ui.ink.textContent = String(Math.max(0, Math.floor(state.ink)));

      const ratio = clamp((state.oreCollected / state.oreGoal) * 100, 0, 100);
      ui.progressText.textContent = `${state.oreCollected} / ${state.oreGoal}`;
      ui.progressMeter.style.width = `${ratio}%`;
      ui.inkText.textContent = `${Math.max(0, Math.floor(state.ink))}%`;
      ui.inkMeter.style.width = `${clamp(state.ink, 0, 100)}%`;

      if (state.oreCollected >= state.oreGoal && !state.portal.active) {
        state.portal.active = true;
        ui.message.textContent = 'The stronghold hums alive. Head to the glowing portal in the deep cave.';
      }

      if (state.oreCollected >= state.oreGoal) {
        ui.objective.textContent = 'A deep portal has opened. Move through it to continue the descent.';
      } else {
        ui.objective.textContent = 'Collect 18 ore. Return to camp to refresh before the next descent.';
      }
    }

    function updatePlayer() {
      let ax = 0;
      let ay = 0;

      if (state.keys['w'] || state.keys['arrowup']) ay -= 1;
      if (state.keys['s'] || state.keys['arrowdown']) ay += 1;
      if (state.keys['a'] || state.keys['arrowleft']) ax -= 1;
      if (state.keys['d'] || state.keys['arrowright']) ax += 1;

      if (ax || ay) {
        const len = Math.hypot(ax, ay) || 1;
        const targetVx = (ax / len) * state.player.speed;
        const targetVy = (ay / len) * state.player.speed;
        state.player.vx += (targetVx - state.player.vx) * 0.28;
        state.player.vy += (targetVy - state.player.vy) * 0.28;
      } else {
        state.player.vx *= 0.8;
        state.player.vy *= 0.8;
      }

      state.player.x += state.player.vx;
      state.player.y += state.player.vy;
      state.player.x = clamp(state.player.x, 30, state.worldWidth - 30);
      state.player.y = clamp(state.player.y, 30, state.worldHeight - 30);

      if (state.player.mineCooldown > 0) state.player.mineCooldown -= 1;
      if (state.player.drawCooldown > 0) state.player.drawCooldown -= 1;
    }

    function mineNearbyRock() {
      let target = null;
      let closest = Infinity;

      for (const rock of state.rocks) {
        const d = dist(state.player.x, state.player.y, rock.x, rock.y);
        if (d < 58 && d < closest) {
          target = rock;
          closest = d;
        }
      }

      if (!target || state.player.mineCooldown > 0) return;

      state.player.mineCooldown = 10;
      target.hp -= 1;
      addParticles(target.x, target.y, target.color, 12, 2.2);

      if (target.hp <= 0) {
        state.oreCollected += target.value;
        state.shards += target.value;
        addParticles(target.x, target.y, '#fff9d8', 20, 2.8);
        state.rocks = state.rocks.filter(r => r !== target);
        ui.message.textContent = `${target.type.toUpperCase()} mined! +${target.value} ore.`;
      } else {
        ui.message.textContent = `${target.type.toUpperCase()} hit. ${target.hp}/${target.maxHp} integrity.`;
      }

      updateHud();
    }

    function drawInkMark() {
      if (state.player.drawCooldown > 0 || state.ink <= 0) return;
      state.player.drawCooldown = 18;
      state.ink = Math.max(0, state.ink - 10);

      const palette = ['#7cc9ff', '#8fe7bb', '#f2b6ca', '#e3c17c'];
      const color = palette[Math.floor(Math.random() * palette.length)];
      let x = state.player.x + rand(-26, 26);
      let y = state.player.y + rand(-26, 26);

      for (const rock of state.rocks) {
        const d = dist(state.player.x, state.player.y, rock.x, rock.y);
        if (d < 90) {
          x = rock.x;
          y = rock.y;
          break;
        }
      }

      addMark(x, y, color);
      addParticles(x, y, color, 16, 2.2);
      ui.message.textContent = 'Ink sparks across the stone.';
      updateHud();
    }

    function handleInteraction() {
      const inCamp = dist(state.player.x, state.player.y, state.camp.x, state.camp.y) < 110;
      const inPortal = dist(state.player.x, state.player.y, state.portal.x, state.portal.y) < 90;

      if (inCamp && state.oreCollected > 0) {
        state.shards += 2;
        state.ink = Math.min(100, state.ink + 18);
        state.oreCollected = 0;
        ui.message.textContent = 'Camp restock complete. The next descent is ready.';
        updateHud();
        return;
      }

      if (inPortal && state.portal.active) {
        state.depth += 1;
        state.oreGoal += 8;
        state.player.x = state.camp.x + 30;
        state.player.y = state.camp.y + 30;
        state.player.vx = 0;
        state.player.vy = 0;
        state.portal.active = false;
        state.rocks = generateRocks();
        state.ink = Math.min(100, state.ink + 18);
        ui.message.textContent = `Depth ${state.depth} unlocked. The ore gets richer.`;
        updateHud();
        return;
      }

      if (inCamp) {
        ui.message.textContent = 'The camp is safe. Gather more ore before moving on.';
      } else if (state.portal.active) {
        ui.message.textContent = 'The deep portal awaits.';
      }
    }

    function updateParticles() {
      for (let i = state.particles.length - 1; i >= 0; i--) {
        const p = state.particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 1;
        if (p.life <= 0) state.particles.splice(i, 1);
      }

      for (let i = state.marks.length - 1; i >= 0; i--) {
        const m = state.marks[i];
        m.life -= 1;
        if (m.life <= 0) state.marks.splice(i, 1);
      }
    }

    function renderBackground(cameraX, cameraY) {
      const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      grad.addColorStop(0, '#0d1419');
      grad.addColorStop(0.45, '#101a22');
      grad.addColorStop(1, '#0b1015');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const tile = 52;
      for (let x = Math.floor(cameraX / tile) * tile; x < cameraX + canvas.width + tile; x += tile) {
        for (let y = Math.floor(cameraY / tile) * tile; y < cameraY + canvas.height + tile; y += tile) {
          const px = x - cameraX;
          const py = y - cameraY;
          ctx.fillStyle = ((Math.floor(x / tile) + Math.floor(y / tile)) % 2 === 0) ? 'rgba(255,255,255,0.014)' : 'rgba(255,255,255,0.008)';
          ctx.fillRect(px, py, tile, tile);
        }
      }

      ctx.beginPath();
      ctx.strokeStyle = 'rgba(255,255,255,0.04)';
      ctx.lineWidth = 1;
      ctx.rect(state.camp.x - cameraX - state.camp.r, state.camp.y - cameraY - state.camp.r, state.camp.r * 2, state.camp.r * 2);
      ctx.stroke();
    }

    function renderCamp(cameraX, cameraY) {
      const cx = state.camp.x - cameraX;
      const cy = state.camp.y - cameraY;

      ctx.beginPath();
      ctx.fillStyle = 'rgba(227,193,124,0.16)';
      ctx.arc(cx, cy, state.camp.r, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.strokeStyle = '#e3c17c';
      ctx.lineWidth = 2;
      ctx.arc(cx, cy, state.camp.r, 0, Math.PI * 2);
      ctx.stroke();

      ctx.fillStyle = '#e3c17c';
      ctx.font = '600 14px sans-serif';
      ctx.fillText('CAMP', cx - 20, cy + 4);
    }

    function renderPortal(cameraX, cameraY) {
      if (!state.portal.active) return;
      const px = state.portal.x - cameraX;
      const py = state.portal.y - cameraY;
      const t = Date.now() * 0.008;

      ctx.beginPath();
      ctx.fillStyle = 'rgba(124,201,255,0.16)';
      ctx.arc(px, py, state.portal.r + 14 + Math.sin(t) * 5, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.strokeStyle = '#7cc9ff';
      ctx.lineWidth = 2;
      ctx.arc(px, py, state.portal.r + Math.sin(t) * 5, 0, Math.PI * 2);
      ctx.stroke();

      ctx.beginPath();
      ctx.fillStyle = '#8fe7bb';
      ctx.arc(px, py, 12 + Math.sin(t * 2) * 3, 0, Math.PI * 2);
      ctx.fill();
    }

    function renderRocks(cameraX, cameraY) {
      for (const rock of state.rocks) {
        const x = rock.x - cameraX;
        const y = rock.y - cameraY;

        ctx.beginPath();
        ctx.fillStyle = rock.color;
        ctx.globalAlpha = 0.74 + rock.glow * 0.12;
        ctx.arc(x, y, rock.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;

        ctx.beginPath();
        ctx.strokeStyle = 'rgba(255,255,255,0.17)';
        ctx.lineWidth = 1.2;
        ctx.arc(x, y, rock.r, 0, Math.PI * 2);
        ctx.stroke();

        ctx.beginPath();
        ctx.fillStyle = 'rgba(255,255,255,0.18)';
        ctx.arc(x - rock.r * 0.22, y - rock.r * 0.2, rock.r * 0.25, 0, Math.PI * 2);
        ctx.fill();

        const barW = rock.r * 1.7;
        ctx.fillStyle = 'rgba(0,0,0,0.28)';
        ctx.fillRect(x - barW / 2, y + rock.r + 8, barW, 5);
        ctx.fillStyle = '#edf6ff';
        ctx.fillRect(x - barW / 2, y + rock.r + 8, (rock.hp / rock.maxHp) * barW, 5);
      }
    }

    function renderMarks(cameraX, cameraY) {
      for (const mark of state.marks) {
        const x = mark.x - cameraX;
        const y = mark.y - cameraY;
        ctx.beginPath();
        ctx.globalAlpha = clamp(mark.life / 70, 0, 1);
        ctx.fillStyle = mark.color;
        ctx.arc(x, y, mark.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }

    function renderParticles(cameraX, cameraY) {
      for (const p of state.particles) {
        ctx.beginPath();
        ctx.fillStyle = p.color;
        ctx.globalAlpha = clamp(p.life / 50, 0, 1);
        ctx.arc(p.x - cameraX, p.y - cameraY, p.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    function renderPlayer(cameraX, cameraY) {
      const px = state.player.x - cameraX;
      const py = state.player.y - cameraY;

      ctx.beginPath();
      ctx.fillStyle = '#edf6ff';
      ctx.arc(px, py, state.player.radius, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.fillStyle = '#7cc9ff';
      ctx.arc(px + 4, py - 2, state.player.radius * 0.4, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.strokeStyle = '#e3c17c';
      ctx.lineWidth = 2.5;
      ctx.moveTo(px - 11, py + 12);
      ctx.lineTo(px + 12, py + 12);
      ctx.stroke();
    }

    function draw() {
      const cameraX = clamp(state.player.x - canvas.width / 2, 0, state.worldWidth - canvas.width);
      const cameraY = clamp(state.player.y - canvas.height / 2, 0, state.worldHeight - canvas.height);
      state.camera.x += (cameraX - state.camera.x) * 0.1;
      state.camera.y += (cameraY - state.camera.y) * 0.1;

      renderBackground(state.camera.x, state.camera.y);
      renderCamp(state.camera.x, state.camera.y);
      renderPortal(state.camera.x, state.camera.y);
      renderRocks(state.camera.x, state.camera.y);
      renderMarks(state.camera.x, state.camera.y);
      renderParticles(state.camera.x, state.camera.y);
      renderPlayer(state.camera.x, state.camera.y);
    }

    function tick() {
      updatePlayer();
      updateParticles();
      draw();
      requestAnimationFrame(tick);
    }

    document.addEventListener('keydown', (event) => {
      const key = event.key.toLowerCase();
      state.keys[key] = true;

      if (key === 'e') mineNearbyRock();
      if (key === 'q') drawInkMark();
      if (key === 'f') handleInteraction();

      if (key === 'r') {
        state.player.x = state.camp.x + 24;
        state.player.y = state.camp.y + 24;
        state.player.vx = 0;
        state.player.vy = 0;
        ui.message.textContent = 'Reset to camp.';
      }
    });

    document.addEventListener('keyup', (event) => {
      const key = event.key.toLowerCase();
      state.keys[key] = false;
    });

    state.rocks = generateRocks();
    updateHud();
    requestAnimationFrame(tick);
  </script>
</body>
</html>
