<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drawing Adventure: Platformer Mine</title>
  <style>
    :root {
      --bg: #0b1015;
      --bg-2: #111c24;
      --panel: rgba(16, 22, 28, 0.9);
      --panel-strong: rgba(20, 27, 34, 0.97);
      --line: rgba(177, 196, 210, 0.14);
      --line-strong: rgba(177, 196, 210, 0.22);
      --text: #edf6ff;
      --muted: #a9bbc9;
      --soft: #dfeaf4;
      --gold: #e3c17c;
      --blue: #7cc9ff;
      --green: #8fe7bb;
      --rose: #f2b6ca;
      --shadow: rgba(0, 0, 0, 0.4);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(circle at top, rgba(124, 201, 255, 0.12), transparent 36%),
        linear-gradient(180deg, var(--bg), var(--bg-2));
      color: var(--text);
      font-family: Inter, "Segoe UI", sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .shell {
      width: min(1340px, calc(100vw - 20px));
      height: min(92vh, 820px);
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      border: 1px solid var(--line);
      background: var(--panel);
      box-shadow: 0 26px 62px var(--shadow);
      border-radius: 22px;
      overflow: hidden;
      backdrop-filter: blur(12px);
    }

    .sidebar {
      position: relative;
      background: linear-gradient(180deg, rgba(15, 22, 28, 0.96), rgba(12, 17, 23, 0.98));
      border-right: 1px solid var(--line);
      padding: 20px 18px 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .sidebar::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(124,201,255,0.04), transparent 30%, rgba(227,193,124,0.04));
      pointer-events: none;
    }

    .brand {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.74rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .brand-mark {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), var(--blue));
      box-shadow: 0 0 16px rgba(124,201,255,0.5);
      position: relative;
    }

    .brand-mark::after {
      content: "";
      position: absolute;
      inset: -6px;
      border: 1px solid rgba(124,201,255,0.26);
      border-radius: 50%;
    }

    .panel {
      position: relative;
      z-index: 1;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 14px 14px 12px;
    }

    h1 {
      margin: 0;
      font-size: 1.18rem;
      letter-spacing: -0.04em;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 10px;
    }

    .stat {
      background: rgba(255,255,255,0.015);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 10px 8px;
    }

    .stat .label {
      display: block;
      font-size: 0.64rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .stat .value {
      font-size: 1.32rem;
      letter-spacing: -0.04em;
      font-weight: 700;
    }

    .objective {
      margin-top: 8px;
      font-size: 0.82rem;
      line-height: 1.6;
      color: var(--muted);
    }

    .bars {
      display: grid;
      gap: 10px;
      margin-top: 4px;
    }

    .bar-wrap {
      display: grid;
      gap: 6px;
    }

    .bar-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.66rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .meter {
      position: relative;
      width: 100%;
      height: 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--line);
      overflow: hidden;
    }

    .meter > span {
      position: absolute;
      inset: 0 auto 0 0;
      width: 50%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--gold), var(--rose));
      box-shadow: inset 0 0 12px rgba(255,255,255,0.12);
    }

    .meter.ink > span {
      background: linear-gradient(90deg, var(--blue), var(--green));
    }

    .controls {
      position: relative;
      z-index: 1;
      margin-top: auto;
      padding: 12px 12px 10px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255,255,255,0.015);
    }

    .controls h2 {
      margin: 0 0 10px;
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--gold);
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .key {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 7px 8px;
    }

    .key kbd {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 26px;
      height: 22px;
      padding: 0 6px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: rgba(255,255,255,0.02);
      color: var(--text);
      font: inherit;
      font-weight: 700;
      font-size: 0.72rem;
    }

    .game-panel {
      position: relative;
      display: flex;
      flex-direction: column;
      background: linear-gradient(180deg, rgba(13,18,24,0.92), rgba(11,14,18,0.96));
      padding: 10px;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: linear-gradient(180deg, #0d1419 0%, #101a22 38%, #0d1318 100%);
      box-shadow: inset 0 0 38px rgba(0,0,0,0.2);
    }

    .message {
      position: absolute;
      left: 20px;
      bottom: 18px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(13,17,21,0.75);
      font-size: 0.77rem;
      color: var(--soft);
      letter-spacing: 0.04em;
      max-width: 440px;
      backdrop-filter: blur(6px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    @media (max-width: 980px) {
      .shell {
        grid-template-columns: 1fr;
        height: auto;
      }
      .sidebar {
        border-right: none;
        border-bottom: 1px solid var(--line);
      }
      .game-panel {
        min-height: 62vh;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark"></span>
        <span>Drawing Adventure</span>
      </div>

      <div class="panel">
        <h1>Mine Runner</h1>
        <div class="stats">
          <div class="stat">
            <span class="label">Depth</span>
            <span class="value" id="depthValue">1</span>
          </div>
          <div class="stat">
            <span class="label">Shards</span>
            <span class="value" id="shardsValue">0</span>
          </div>
          <div class="stat">
            <span class="label">Ore</span>
            <span class="value" id="oreValue">0</span>
          </div>
          <div class="stat">
            <span class="label">Ink</span>
            <span class="value" id="inkValue">100</span>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="bars">
          <div class="bar-wrap">
            <div class="bar-head">
              <span>Goal</span>
              <span id="progressText">0 / 12</span>
            </div>
            <div class="meter"><span id="progressMeter" style="width:0%"></span></div>
          </div>
          <div class="bar-wrap">
            <div class="bar-head">
              <span>Ink</span>
              <span id="inkText">100%</span>
            </div>
            <div class="meter ink"><span id="inkMeter" style="width:100%"></span></div>
          </div>
        </div>
        <p class="objective" id="objectiveText">
          Gather 12 ore, then reach the deep portal high in the caves.
        </p>
      </div>

      <div class="controls">
        <h2>Controls</h2>
        <div class="keys">
          <div class="key"><kbd>A / D</kbd><span>Move</span></div>
          <div class="key"><kbd>W / ↑</kbd><span>Jump</span></div>
          <div class="key"><kbd>E</kbd><span>Mine</span></div>
          <div class="key"><kbd>Q</kbd><span>Draw</span></div>
        </div>
      </div>
    </aside>

    <main class="game-panel">
      <canvas id="gameCanvas" width="1040" height="760"></canvas>
      <div class="message" id="messageBox">The camp overlooks the mine. Jump to the ledges, gather ore, and reach the portal.</div>
    </main>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const ui = {
      depth: document.getElementById('depthValue'),
      shards: document.getElementById('shardsValue'),
      ore: document.getElementById('oreValue'),
      ink: document.getElementById('inkValue'),
      objective: document.getElementById('objectiveText'),
      progressText: document.getElementById('progressText'),
      progressMeter: document.getElementById('progressMeter'),
      inkText: document.getElementById('inkText'),
      inkMeter: document.getElementById('inkMeter'),
      message: document.getElementById('messageBox')
    };

    const state = {
      width: 2800,
      height: 1100,
      depth: 1,
      oreGoal: 12,
      oreCollected: 0,
      shards: 0,
      ink: 100,
      cameraX: 0,
      keys: {},
      particles: [],
      marks: [],
      messageTimer: 0,
      won: false,
      player: {
        x: 160,
        y: 680,
        w: 26,
        h: 40,
        vx: 0,
        vy: 0,
        speed: 3.6,
        jump: 12.6,
        onGround: false,
        miningCooldown: 0,
        drawCooldown: 0,
      },
      camp: { x: 90, y: 700, w: 150, h: 110 },
      portal: { x: 2520, y: 440, w: 96, h: 150, active: false },
      platforms: [],
      ore: []
    };

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function rand(min, max) {
      return Math.random() * (max - min) + min;
    }

    function rectsIntersect(a, b) {
      return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    }

    function addParticles(x, y, color, count = 16, speed = 2.8) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const v = rand(0.8, speed + 1.4);
        state.particles.push({
          x,
          y,
          vx: Math.cos(angle) * v,
          vy: Math.sin(angle) * v,
          r: rand(2, 4.5),
          life: rand(24, 52),
          color
        });
      }
    }

    function addMark(x, y, color) {
      state.marks.push({
        x,
        y,
        r: rand(16, 26),
        life: 72,
        color
      });
    }

    function buildLevel() {
      state.platforms = [
        { x: 0, y: 780, w: state.width, h: 320, type: 'ground' },
        { x: 220, y: 680, w: 180, h: 20, type: 'stone' },
        { x: 520, y: 620, w: 170, h: 18, type: 'stone' },
        { x: 790, y: 560, w: 180, h: 18, type: 'stone' },
        { x: 1100, y: 500, w: 200, h: 18, type: 'stone' },
        { x: 1460, y: 630, w: 170, h: 18, type: 'stone' },
        { x: 1720, y: 560, w: 180, h: 18, type: 'stone' },
        { x: 2030, y: 490, w: 210, h: 18, type: 'stone' },
        { x: 2280, y: 430, w: 140, h: 18, type: 'stone' },
      ];

      state.ore = [
        { x: 260, y: 640, r: 12, value: 1, color: '#7cc9ff' },
        { x: 590, y: 580, r: 12, value: 1, color: '#7cc9ff' },
        { x: 865, y: 520, r: 12, value: 1, color: '#8fe7bb' },
        { x: 1195, y: 460, r: 12, value: 1, color: '#e3c17c' },
        { x: 1540, y: 590, r: 12, value: 1, color: '#7cc9ff' },
        { x: 1808, y: 520, r: 12, value: 1, color: '#f2b6ca' },
        { x: 2120, y: 450, r: 12, value: 1, color: '#e3c17c' },
        { x: 2350, y: 390, r: 12, value: 1, color: '#8fe7bb' },
        { x: 760, y: 420, r: 12, value: 1, color: '#7cc9ff' },
        { x: 1670, y: 420, r: 12, value: 1, color: '#7cc9ff' },
        { x: 2050, y: 290, r: 12, value: 1, color: '#e3c17c' },
        { x: 2440, y: 330, r: 12, value: 1, color: '#8fe7bb' }
      ];
    }

    function updateHud() {
      ui.depth.textContent = String(state.depth);
      ui.shards.textContent = String(state.shards);
      ui.ore.textContent = String(state.oreCollected);
      ui.ink.textContent = String(Math.max(0, Math.floor(state.ink)));

      const progress = clamp((state.oreCollected / state.oreGoal) * 100, 0, 100);
      ui.progressText.textContent = `${state.oreCollected} / ${state.oreGoal}`;
      ui.progressMeter.style.width = `${progress}%`;
      ui.inkText.textContent = `${Math.max(0, Math.floor(state.ink))}%`;
      ui.inkMeter.style.width = `${clamp(state.ink, 0, 100)}%`;

      if (state.oreCollected >= state.oreGoal && !state.portal.active) {
        state.portal.active = true;
        ui.message.textContent = 'The deep portal awakens. Climb higher and reach it.';
      }

      if (state.oreCollected >= state.oreGoal) {
        ui.objective.textContent = 'The portal is open. Reach the glowing doorway at the far end of the cave.';
      } else {
        ui.objective.textContent = 'Gather 12 ore, then reach the deep portal high in the caves.';
      }
    }

    function handleMovement() {
      const left = state.keys['a'] || state.keys['arrowleft'];
      const right = state.keys['d'] || state.keys['arrowright'];
      const jump = state.keys['w'] || state.keys['arrowup'] || state.keys[' '];

      if (left) state.player.vx = -state.player.speed;
      else if (right) state.player.vx = state.player.speed;
      else state.player.vx *= 0.7;

      if (jump && state.player.onGround) {
        state.player.vy = -state.player.jump;
        state.player.onGround = false;
      }

      state.player.vy += 0.5;
    }

    function handleMining() {
      if (state.player.miningCooldown > 0) return;
      for (const ore of state.ore) {
        const dX = Math.abs(state.player.x + state.player.w / 2 - ore.x);
        const dY = Math.abs(state.player.y + state.player.h / 2 - ore.y);
        if (dX < 26 && dY < 26) {
          state.player.miningCooldown = 12;
          state.oreCollected += ore.value;
          state.shards += ore.value;
          state.ore = state.ore.filter(o => o !== ore);
          addParticles(ore.x, ore.y, ore.color, 18, 2.8);
          ui.message.textContent = `Ore mined! +${ore.value} ore.`;
          updateHud();
          return;
        }
      }
    }

    function handleDraw() {
      if (state.player.drawCooldown > 0 || state.ink <= 0) return;
      state.player.drawCooldown = 18;
      state.ink = Math.max(0, state.ink - 8);
      const color = ['#7cc9ff', '#8fe7bb', '#f2b6ca', '#e3c17c'][Math.floor(Math.random() * 4)];
      const x = state.player.x + state.player.w / 2 + rand(-18, 18);
      const y = state.player.y + state.player.h / 2 + rand(-18, 18);
      addMark(x, y, color);
      addParticles(x, y, color, 12, 2.1);
      ui.message.textContent = 'A bright ink glyph flashes across the stone.';
      updateHud();
    }

    function applyPhysics() {
      const p = state.player;
      p.x += p.vx;
      p.y += p.vy;

      p.onGround = false;
      for (const plat of state.platforms) {
        const playerBox = { x: p.x, y: p.y, w: p.w, h: p.h };
        const platformBox = { x: plat.x, y: plat.y, w: plat.w, h: plat.h };
        if (rectsIntersect(playerBox, platformBox)) {
          const prevY = p.y - p.vy;
          const prevBottom = prevY + p.h;
          const prevTop = prevY;
          const nextBottom = p.y + p.h;
          const nextTop = p.y;

          if (p.vy >= 0 && prevBottom <= plat.y + 8 && nextBottom >= plat.y) {
            p.y = plat.y - p.h;
            p.vy = 0;
            p.onGround = true;
          } else if (p.vy < 0 && prevTop >= plat.y + plat.h - 8 && nextTop <= plat.y + plat.h) {
            p.y = plat.y + plat.h;
            p.vy = 0;
          } else if (p.vx > 0 && p.x + p.w > plat.x && p.x < plat.x + plat.w) {
            p.x = plat.x - p.w;
            p.vx = 0;
          } else if (p.vx < 0 && p.x < plat.x + plat.w && p.x + p.w > plat.x) {
            p.x = plat.x + plat.w;
            p.vx = 0;
          }
        }
      }

      if (p.y > state.height + 200) {
        p.x = 160;
        p.y = 680;
        p.vx = 0;
        p.vy = 0;
        state.ink = Math.max(10, state.ink - 10);
        ui.message.textContent = 'A hard fall costs ink. Get back to the ledges.';
      }

      if (state.player.miningCooldown > 0) state.player.miningCooldown -= 1;
      if (state.player.drawCooldown > 0) state.player.drawCooldown -= 1;
    }

    function checkPortal() {
      const p = state.player;
      const portalRect = { x: state.portal.x, y: state.portal.y, w: state.portal.w, h: state.portal.h };
      const playerRect = { x: p.x, y: p.y, w: p.w, h: p.h };
      if (state.portal.active && rectsIntersect(playerRect, portalRect)) {
        state.depth += 1;
        state.oreGoal += 8;
        state.player.x = 180;
        state.player.y = 600;
        state.player.vx = 0;
        state.player.vy = 0;
        state.portal.active = false;
        state.ore = state.ore.concat([
          { x: 650, y: 620, r: 12, value: 1, color: '#7cc9ff' },
          { x: 880, y: 500, r: 12, value: 1, color: '#8fe7bb' },
          { x: 1500, y: 610, r: 12, value: 1, color: '#e3c17c' },
          { x: 1860, y: 470, r: 12, value: 1, color: '#7cc9ff' },
          { x: 2280, y: 360, r: 12, value: 1, color: '#8fe7bb' }
        ]);
        state.ink = Math.min(100, state.ink + 18);
        ui.message.textContent = `Depth ${state.depth} reached. The cave becomes sharper and the ore grows richer.`;
        updateHud();
      }
    }

    function updateParticles() {
      for (let i = state.particles.length - 1; i >= 0; i--) {
        const p = state.particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 1;
        if (p.life <= 0) state.particles.splice(i, 1);
      }

      for (let i = state.marks.length - 1; i >= 0; i--) {
        const m = state.marks[i];
        m.life -= 1;
        if (m.life <= 0) state.marks.splice(i, 1);
      }
    }

    function renderBackground(cameraX) {
      const g = ctx.createLinearGradient(0, 0, 0, canvas.height);
      g.addColorStop(0, '#0d1419');
      g.addColorStop(0.48, '#101a22');
      g.addColorStop(1, '#0d1318');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < 7; i++) {
        ctx.beginPath();
        ctx.fillStyle = i % 2 === 0 ? 'rgba(33, 48, 58, 0.9)' : 'rgba(26, 39, 48, 0.85)';
        ctx.moveTo(i * 300 - cameraX * 0.15, canvas.height);
        ctx.lineTo(i * 300 + 240 - cameraX * 0.15, 180 + (i % 3) * 40);
        ctx.lineTo(i * 300 + 480 - cameraX * 0.15, canvas.height);
        ctx.closePath();
        ctx.fill();
      }

      ctx.fillStyle = 'rgba(255,255,255,0.015)';
      for (let x = 0; x < canvas.width + 30; x += 52) {
        ctx.fillRect(x + ((cameraX * 0.1) % 52) - 52, 0, 1, canvas.height);
      }
    }

    function renderPlatforms(cameraX) {
      for (const p of state.platforms) {
        const x = p.x - cameraX;
        const y = p.y;

        ctx.fillStyle = p.type === 'ground' ? '#2e3d48' : '#405563';
        ctx.fillRect(x, y, p.w, p.h);

        ctx.fillStyle = 'rgba(255,255,255,0.04)';
        ctx.fillRect(x, y, p.w, 4);

        if (p.type === 'ground') {
          ctx.fillStyle = 'rgba(255,255,255,0.02)';
          for (let i = 0; i < p.w; i += 18) {
            ctx.fillRect(x + i, y + 16, 10, 3);
          }
        }
      }
    }

    function renderOre(cameraX) {
      for (const o of state.ore) {
        const x = o.x - cameraX;
        const y = o.y;

        ctx.beginPath();
        ctx.fillStyle = o.color;
        ctx.arc(x, y, o.r, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.strokeStyle = 'rgba(255,255,255,0.4)';
        ctx.lineWidth = 1.5;
        ctx.arc(x, y, o.r + 2, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    function renderMarks(cameraX) {
      for (const m of state.marks) {
        const x = m.x - cameraX;
        const y = m.y;
        ctx.beginPath();
        ctx.fillStyle = m.color;
        ctx.globalAlpha = clamp(m.life / 72, 0, 1);
        ctx.arc(x, y, m.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }

    function renderParticles(cameraX) {
      for (const p of state.particles) {
        ctx.beginPath();
        ctx.fillStyle = p.color;
        ctx.globalAlpha = clamp(p.life / 50, 0, 1);
        ctx.arc(p.x - cameraX, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    function renderPortal(cameraX) {
      const x = state.portal.x - cameraX;
      const y = state.portal.y;
      const t = Date.now() * 0.008;

      if (!state.portal.active) {
        ctx.fillStyle = 'rgba(115, 130, 140, 0.22)';
        ctx.fillRect(x, y, state.portal.w, state.portal.h);
        return;
      }

      ctx.fillStyle = 'rgba(124, 201, 255, 0.14)';
      ctx.fillRect(x - 14, y - 6, state.portal.w + 28, state.portal.h + 12);

      ctx.strokeStyle = '#7cc9ff';
      ctx.lineWidth = 2;
      ctx.strokeRect(x, y, state.portal.w, state.portal.h);

      for (let i = 0; i < 4; i++) {
        ctx.beginPath();
        ctx.fillStyle = 'rgba(124,201,255,0.3)';
        ctx.arc(x + state.portal.w / 2 + Math.sin(t + i) * 12, y + 40 + i * 20, 10 + Math.sin(t + i * 1.4) * 4, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function renderPlayer(cameraX) {
      const p = state.player;
      const x = p.x - cameraX;
      const y = p.y;

      ctx.fillStyle = '#edf6ff';
      ctx.fillRect(x + 7, y + 2, 12, 14);
      ctx.fillStyle = '#7cc9ff';
      ctx.fillRect(x + 5, y + 16, 16, 20);
      ctx.fillStyle = '#e3c17c';
      ctx.fillRect(x + 2, y + 32, 8, 12);
      ctx.fillRect(x + 16, y + 32, 8, 12);
      ctx.fillStyle = '#f2b6ca';
      ctx.fillRect(x + 8, y + 8, 10, 6);
      ctx.fillStyle = '#0d1318';
      ctx.fillRect(x + 8, y + 10, 3, 3);
      ctx.fillRect(x + 15, y + 10, 3, 3);
    }

    function renderCamp(cameraX) {
      const x = state.camp.x - cameraX;
      const y = state.camp.y;
      ctx.fillStyle = '#d5b36c';
      ctx.fillRect(x, y, state.camp.w, state.camp.h);
      ctx.fillStyle = 'rgba(255,255,255,0.18)';
      ctx.fillRect(x + 18, y + 24, state.camp.w - 36, 18);
      ctx.fillStyle = '#0d1318';
      ctx.fillRect(x + 22, y + 62, 14, 32);
      ctx.fillRect(x + state.camp.w - 36, y + 62, 14, 32);
      ctx.fillStyle = '#e3c17c';
      ctx.fillText('CAMP', x + 30, y - 12);
    }

    function render() {
      const cameraX = clamp(state.player.x - canvas.width / 2, 0, state.width - canvas.width);
      state.cameraX += (cameraX - state.cameraX) * 0.12;

      renderBackground(state.cameraX);
      renderPlatforms(state.cameraX);
      renderOre(state.cameraX);
      renderMarks(state.cameraX);
      renderParticles(state.cameraX);
      renderCamp(state.cameraX);
      renderPortal(state.cameraX);
      renderPlayer(state.cameraX);
    }

    function tick() {
      handleMovement();
      applyPhysics();
      updateParticles();
      render();
      checkPortal();
      requestAnimationFrame(tick);
    }

    document.addEventListener('keydown', (event) => {
      const key = event.key.toLowerCase();
      state.keys[key] = true;

      if (key === 'e') handleMining();
      if (key === 'q') handleDraw();
      if (key === ' ') state.keys[' '] = true;
    });

    document.addEventListener('keyup', (event) => {
      const key = event.key.toLowerCase();
      state.keys[key] = false;
      if (key === ' ') state.keys[' '] = false;
    });

    buildLevel();
    updateHud();
    requestAnimationFrame(tick);
  </script>
</body>
</html>
