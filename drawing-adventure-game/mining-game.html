<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drawing Adventure: Mine Runner</title>
  <style>
    :root {
      --bg: #0a1015;
      --bg-2: #101b23;
      --panel: rgba(16, 22, 28, 0.92);
      --panel-strong: rgba(20, 27, 34, 0.97);
      --line: rgba(177, 196, 210, 0.14);
      --text: #edf6ff;
      --muted: #a8bbca;
      --gold: #e3c17c;
      --blue: #7cc9ff;
      --green: #8fe7bb;
      --rose: #f2b6ca;
      --shadow: rgba(0, 0, 0, 0.42);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(circle at top, rgba(124, 201, 255, 0.12), transparent 30%),
        linear-gradient(180deg, var(--bg), var(--bg-2));
      color: var(--text);
      font-family: Inter, "Segoe UI", sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .shell {
      width: min(1340px, calc(100vw - 20px));
      height: min(92vh, 820px);
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 30px 70px var(--shadow);
      backdrop-filter: blur(12px);
    }

    .sidebar {
      position: relative;
      background: linear-gradient(180deg, rgba(15, 22, 28, 0.96), rgba(12, 17, 23, 0.98));
      border-right: 1px solid var(--line);
      padding: 20px 18px 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .sidebar::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(124, 201, 255, 0.04), transparent 34%, rgba(227, 193, 124, 0.05));
      pointer-events: none;
    }

    .brand {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.74rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .brand-mark {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), var(--blue));
      box-shadow: 0 0 16px rgba(124,201,255,0.5);
      position: relative;
    }

    .brand-mark::after {
      content: "";
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      border: 1px solid rgba(124,201,255,0.26);
    }

    .panel {
      position: relative;
      z-index: 1;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 14px 14px 12px;
    }

    h1 {
      margin: 0;
      font-size: 1.18rem;
      letter-spacing: -0.04em;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 10px;
    }

    .stat {
      background: rgba(255,255,255,0.015);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 10px 8px;
    }

    .stat .label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.64rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .stat .value {
      font-size: 1.32rem;
      font-weight: 700;
      letter-spacing: -0.04em;
    }

    .objective {
      margin-top: 8px;
      font-size: 0.82rem;
      line-height: 1.6;
      color: var(--muted);
    }

    .bars {
      display: grid;
      gap: 10px;
      margin-top: 4px;
    }

    .bar-wrap {
      display: grid;
      gap: 6px;
    }

    .bar-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.66rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .meter {
      position: relative;
      width: 100%;
      height: 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--line);
      overflow: hidden;
    }

    .meter > span {
      position: absolute;
      inset: 0 auto 0 0;
      width: 50%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--gold), var(--rose));
      box-shadow: inset 0 0 12px rgba(255,255,255,0.12);
    }

    .meter.ink > span {
      background: linear-gradient(90deg, var(--blue), var(--green));
    }

    .controls {
      position: relative;
      z-index: 1;
      margin-top: auto;
      padding: 12px 12px 10px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255,255,255,0.015);
    }

    .controls h2 {
      margin: 0 0 10px;
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--gold);
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .key {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 7px 8px;
    }

    .key kbd {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 26px;
      height: 22px;
      padding: 0 6px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: rgba(255,255,255,0.02);
      color: var(--text);
      font: inherit;
      font-weight: 700;
      font-size: 0.72rem;
    }

    .game-panel {
      position: relative;
      display: flex;
      flex-direction: column;
      background: linear-gradient(180deg, rgba(13,18,24,0.92), rgba(11,14,18,0.96));
      padding: 10px;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: linear-gradient(180deg, #0d1419 0%, #101a22 38%, #0d1318 100%);
      box-shadow: inset 0 0 38px rgba(0,0,0,0.2);
    }

    .message {
      position: absolute;
      left: 20px;
      bottom: 18px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(13,17,21,0.75);
      font-size: 0.77rem;
      color: var(--soft);
      letter-spacing: 0.04em;
      max-width: 440px;
      backdrop-filter: blur(6px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    @media (max-width: 980px) {
      .shell {
        grid-template-columns: 1fr;
        height: auto;
      }
      .sidebar {
        border-right: none;
        border-bottom: 1px solid var(--line);
      }
      .game-panel {
        min-height: 62vh;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark"></span>
        <span>Drawing Adventure</span>
      </div>

      <div class="panel">
        <h1>Mine Runner</h1>
        <div class="stats">
          <div class="stat">
            <span class="label">Depth</span>
            <span class="value" id="depthValue">1</span>
          </div>
          <div class="stat">
            <span class="label">Shards</span>
            <span class="value" id="shardsValue">0</span>
          </div>
          <div class="stat">
            <span class="label">Ore</span>
            <span class="value" id="oreValue">0</span>
          </div>
          <div class="stat">
            <span class="label">Ink</span>
            <span class="value" id="inkValue">100</span>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="bars">
          <div class="bar-wrap">
            <div class="bar-head">
              <span>Goal</span>
              <span id="progressText">0 / 12</span>
            </div>
            <div class="meter"><span id="progressMeter" style="width:0%"></span></div>
          </div>
          <div class="bar-wrap">
            <div class="bar-head">
              <span>Ink</span>
              <span id="inkText">100%</span>
            </div>
            <div class="meter ink"><span id="inkMeter" style="width:100%"></span></div>
          </div>
        </div>
        <p class="objective" id="objectiveText">
          Gather 12 ore, then reach the portal high in the caves.
        </p>
      </div>

      <div class="controls">
        <h2>Controls</h2>
        <div class="keys">
          <div class="key"><kbd>A / D</kbd><span>Move</span></div>
          <div class="key"><kbd>W / ↑</kbd><span>Jump</span></div>
          <div class="key"><kbd>E</kbd><span>Mine</span></div>
          <div class="key"><kbd>Q</kbd><span>Draw</span></div>
        </div>
      </div>
    </aside>

    <main class="game-panel">
      <canvas id="gameCanvas" width="1040" height="760"></canvas>
      <div class="message" id="messageBox">The camp overlooks the mine. Jump across the ledges, gather ore, and reach the portal.</div>
    </main>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const ui = {
      depth: document.getElementById('depthValue'),
      shards: document.getElementById('shardsValue'),
      ore: document.getElementById('oreValue'),
      ink: document.getElementById('inkValue'),
      objective: document.getElementById('objectiveText'),
      progressText: document.getElementById('progressText'),
      progressMeter: document.getElementById('progressMeter'),
      inkText: document.getElementById('inkText'),
      inkMeter: document.getElementById('inkMeter'),
      message: document.getElementById('messageBox')
    };

    const world = {
      width: 3600,
      height: 1160,
      depth: 1,
      oreGoal: 12,
      oreCollected: 0,
      shards: 0,
      ink: 100,
      cameraX: 0,
      keys: {},
      particles: [],
      marks: [],
      drawBoost: 0,
      won: false,
      player: {
        x: 120,
        y: 620,
        w: 26,
        h: 40,
        vx: 0,
        vy: 0,
        speed: 3.6,
        jump: 11.5,
        onGround: false,
        miningCooldown: 0,
        drawCooldown: 0,
      },
      camp: { x: 100, y: 700, w: 150, h: 118 },
      portal: { x: 3340, y: 454, w: 96, h: 150, active: false },
      platforms: [],
      ore: [],
      hazards: []
    };

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function rand(min, max) {
      return Math.random() * (max - min) + min;
    }

    function rectsIntersect(a, b) {
      return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    }

    function addParticles(x, y, color, count = 16, speed = 2.8) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const v = rand(0.8, speed + 1.4);
        world.particles.push({ x, y, vx: Math.cos(angle) * v, vy: Math.sin(angle) * v, r: rand(2, 4.6), life: rand(18, 48), color });
      }
    }

    function addMark(x, y, color) {
      world.marks.push({ x, y, r: rand(16, 30), life: 72, color });
    }

    function buildLevel() {
      world.platforms = [
        { x: 0, y: 820, w: 3600, h: 360, type: 'ground' },
        { x: 220, y: 700, w: 190, h: 18, type: 'stone' },
        { x: 500, y: 640, w: 170, h: 18, type: 'stone' },
        { x: 770, y: 565, w: 180, h: 18, type: 'stone' },
        { x: 1090, y: 500, w: 190, h: 18, type: 'stone' },
        { x: 1360, y: 620, w: 170, h: 18, type: 'stone' },
        { x: 1650, y: 560, w: 170, h: 18, type: 'stone' },
        { x: 2030, y: 480, w: 210, h: 18, type: 'stone' },
        { x: 2360, y: 420, w: 170, h: 18, type: 'stone' },
        { x: 2720, y: 520, w: 180, h: 18, type: 'stone' },
        { x: 3040, y: 600, w: 230, h: 18, type: 'stone' }
      ];

      world.hazards = [
        { x: 350, y: 804, w: 90, h: 18, kind: 'spikes' },
        { x: 950, y: 804, w: 130, h: 18, kind: 'spikes' },
        { x: 1880, y: 804, w: 140, h: 18, kind: 'spikes' },
        { x: 2580, y: 804, w: 160, h: 18, kind: 'spikes' }
      ];

      world.ore = [
        { x: 280, y: 660, r: 12, value: 1, color: '#7cc9ff' },
        { x: 560, y: 600, r: 12, value: 1, color: '#7cc9ff' },
        { x: 850, y: 525, r: 12, value: 1, color: '#8fe7bb' },
        { x: 1170, y: 460, r: 12, value: 1, color: '#e3c17c' },
        { x: 1470, y: 580, r: 12, value: 1, color: '#7cc9ff' },
        { x: 1730, y: 520, r: 12, value: 1, color: '#f2b6ca' },
        { x: 2120, y: 440, r: 12, value: 1, color: '#e3c17c' },
        { x: 2435, y: 380, r: 12, value: 1, color: '#8fe7bb' },
        { x: 2810, y: 480, r: 12, value: 1, color: '#7cc9ff' },
        { x: 3115, y: 560, r: 12, value: 1, color: '#7cc9ff' },
        { x: 3260, y: 360, r: 12, value: 1, color: '#e3c17c' },
        { x: 940, y: 425, r: 12, value: 1, color: '#8fe7bb' }
      ];
    }

    function updateHud() {
      ui.depth.textContent = String(world.depth);
      ui.shards.textContent = String(world.shards);
      ui.ore.textContent = String(world.oreCollected);
      ui.ink.textContent = String(Math.max(0, Math.floor(world.ink)));

      const progress = clamp((world.oreCollected / world.oreGoal) * 100, 0, 100);
      ui.progressText.textContent = `${world.oreCollected} / ${world.oreGoal}`;
      ui.progressMeter.style.width = `${progress}%`;
      ui.inkText.textContent = `${Math.max(0, Math.floor(world.ink))}%`;
      ui.inkMeter.style.width = `${clamp(world.ink, 0, 100)}%`;

      if (world.oreCollected >= world.oreGoal && !world.portal.active) {
        world.portal.active = true;
        ui.message.textContent = 'The portal awakens. You can finally climb toward the deeper cave.';
      }

      if (world.oreCollected >= world.oreGoal) {
        ui.objective.textContent = 'The portal is open. Reach the glowing gate at the far right.';
      } else {
        ui.objective.textContent = 'Gather 12 ore, then reach the deep portal high in the cave.';
      }
    }

    function setMessage(text) {
      ui.message.textContent = text;
    }

    function movePlayer() {
      const p = world.player;
      const left = world.keys['a'] || world.keys['arrowleft'];
      const right = world.keys['d'] || world.keys['arrowright'];
      const jump = world.keys['w'] || world.keys['arrowup'] || world.keys[' '];

      if (left) p.vx = -p.speed;
      else if (right) p.vx = p.speed;
      else p.vx *= 0.7;

      if (jump && p.onGround) {
        p.vy = -p.jump;
        p.onGround = false;
      }

      p.vy += 0.48;
      p.vy = clamp(p.vy, -18, 15);

      if (world.drawBoost > 0) {
        world.drawBoost -= 1;
        p.speed = 4.3;
      } else {
        p.speed = 3.6;
      }

      const prevX = p.x;
      const prevY = p.y;
      p.x += p.vx;
      for (const solid of world.platforms) {
        const a = { x: p.x, y: p.y, w: p.w, h: p.h };
        const b = { x: solid.x, y: solid.y, w: solid.w, h: solid.h };
        if (rectsIntersect(a, b)) {
          if (p.vx > 0 && prevX + p.w <= solid.x + 10) {
            p.x = solid.x - p.w;
          } else if (p.vx < 0 && prevX >= solid.x + solid.w - 10) {
            p.x = solid.x + solid.w;
          }
          p.vx = 0;
        }
      }

      p.y += p.vy;
      p.onGround = false;
      for (const solid of world.platforms) {
        const a = { x: p.x, y: p.y, w: p.w, h: p.h };
        const b = { x: solid.x, y: solid.y, w: solid.w, h: solid.h };
        if (rectsIntersect(a, b)) {
          const previousBottom = prevY + p.h;
          const previousTop = prevY;
          if (p.vy >= 0 && previousBottom <= solid.y + 10) {
            p.y = solid.y - p.h;
            p.vy = 0;
            p.onGround = true;
          } else if (p.vy < 0 && previousTop >= solid.y + solid.h - 10) {
            p.y = solid.y + solid.h;
            p.vy = 0;
          }
        }
      }

      p.x = clamp(p.x, 0, world.width - p.w);
      p.y = clamp(p.y, 0, world.height + 220);

      if (p.y > world.height + 80) {
        p.x = 120;
        p.y = 620;
        p.vx = 0;
        p.vy = 0;
        world.ink = Math.max(10, world.ink - 10);
        setMessage('A hard fall costs ink. Recover and keep climbing.');
      }

      if (world.player.miningCooldown > 0) world.player.miningCooldown -= 1;
      if (world.player.drawCooldown > 0) world.player.drawCooldown -= 1;

      for (const hazard of world.hazards) {
        if (rectsIntersect({ x: p.x, y: p.y, w: p.w, h: p.h }, hazard)) {
          p.x = 120;
          p.y = 620;
          p.vx = 0;
          p.vy = 0;
          world.ink = Math.max(0, world.ink - 15);
          setMessage('Spikes! The cave bites back.');
        }
      }
    }

    function mineNearbyOre() {
      const p = world.player;
      if (p.miningCooldown > 0) return;

      let target = null;
      let best = Infinity;
      for (const ore of world.ore) {
        const dx = Math.abs((p.x + p.w / 2) - ore.x);
        const dy = Math.abs((p.y + p.h / 2) - ore.y);
        const d = Math.hypot(dx, dy);
        if (d < 34 && d < best) {
          best = d;
          target = ore;
        }
      }

      if (!target) {
        setMessage('No ore close enough to mine.');
        return;
      }

      p.miningCooldown = 14;
      world.ore = world.ore.filter(o => o !== target);
      world.oreCollected += 1;
      world.shards += 1;
      addParticles(target.x, target.y, target.color, 18, 2.8);
      setMessage(`Ore mined! +1 ore.`);
      updateHud();
    }

    function inkBurst() {
      const p = world.player;
      if (world.player.drawCooldown > 0 || world.ink <= 0) return;
      world.player.drawCooldown = 18;
      world.ink = Math.max(0, world.ink - 8);
      world.drawBoost = 32;

      const color = ['#7cc9ff', '#8fe7bb', '#f2b6ca', '#e3c17c'][Math.floor(Math.random() * 4)];
      const x = p.x + p.w / 2 + rand(-18, 18);
      const y = p.y + p.h / 2 + rand(-18, 18);
      addMark(x, y, color);
      addParticles(x, y, color, 16, 2.1);
      setMessage('A quick ink burst gives you a brighter stride.');
      updateHud();
    }

    function checkPortal() {
      const p = world.player;
      const portalRect = { x: world.portal.x, y: world.portal.y, w: world.portal.w, h: world.portal.h };
      const playerRect = { x: p.x, y: p.y, w: p.w, h: p.h };
      if (world.portal.active && rectsIntersect(playerRect, portalRect)) {
        world.depth += 1;
        world.oreGoal += 8;
        world.player.x = 120;
        world.player.y = 620;
        world.player.vx = 0;
        world.player.vy = 0;
        world.portal.active = false;
        world.ore = [
          { x: 620, y: 600, r: 12, value: 1, color: '#7cc9ff' },
          { x: 910, y: 500, r: 12, value: 1, color: '#8fe7bb' },
          { x: 1470, y: 560, r: 12, value: 1, color: '#e3c17c' },
          { x: 1820, y: 470, r: 12, value: 1, color: '#7cc9ff' },
          { x: 2230, y: 395, r: 12, value: 1, color: '#8fe7bb' },
          { x: 2800, y: 475, r: 12, value: 1, color: '#7cc9ff' },
          { x: 3240, y: 560, r: 12, value: 1, color: '#f2b6ca' },
          { x: 2450, y: 330, r: 12, value: 1, color: '#e3c17c' }
        ];
        world.ink = Math.min(100, world.ink + 20);
        setMessage(`Depth ${world.depth} reached. The cave grows richer.`);
        updateHud();
      }
    }

    function updateParticles() {
      for (let i = world.particles.length - 1; i >= 0; i--) {
        const p = world.particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 1;
        if (p.life <= 0) world.particles.splice(i, 1);
      }

      for (let i = world.marks.length - 1; i >= 0; i--) {
        const m = world.marks[i];
        m.life -= 1;
        if (m.life <= 0) world.marks.splice(i, 1);
      }
    }

    function renderBackground(cameraX) {
      const g = ctx.createLinearGradient(0, 0, 0, canvas.height);
      g.addColorStop(0, '#0d1419');
      g.addColorStop(0.5, '#101a22');
      g.addColorStop(1, '#0d1318');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < 7; i++) {
        const x = i * 350 - cameraX * 0.18;
        ctx.beginPath();
        ctx.fillStyle = i % 2 === 0 ? 'rgba(40, 57, 68, 0.9)' : 'rgba(30, 45, 54, 0.85)';
        ctx.moveTo(x, canvas.height);
        ctx.lineTo(x + 220, 180 + (i % 3) * 55);
        ctx.lineTo(x + 420, canvas.height);
        ctx.closePath();
        ctx.fill();
      }

      ctx.fillStyle = 'rgba(255,255,255,0.015)';
      for (let x = 0; x < canvas.width + 60; x += 52) {
        ctx.fillRect(x + ((cameraX * 0.1) % 52) - 52, 0, 1, canvas.height);
      }
    }

    function renderCamp(cameraX) {
      const x = world.camp.x - cameraX;
      const y = world.camp.y;
      ctx.fillStyle = '#d5b36c';
      ctx.fillRect(x, y, world.camp.w, world.camp.h);
      ctx.fillStyle = 'rgba(255,255,255,0.18)';
      ctx.fillRect(x + 18, y + 24, world.camp.w - 36, 18);
      ctx.fillStyle = '#0d1318';
      ctx.fillRect(x + 22, y + 62, 14, 32);
      ctx.fillRect(x + world.camp.w - 36, y + 62, 14, 32);
      ctx.fillStyle = '#e3c17c';
      ctx.font = '600 14px sans-serif';
      ctx.fillText('CAMP', x + 30, y - 12);
    }

    function renderPlatforms(cameraX) {
      for (const p of world.platforms) {
        const x = p.x - cameraX;
        ctx.fillStyle = p.type === 'ground' ? '#2c3d4b' : '#405563';
        ctx.fillRect(x, p.y, p.w, p.h);
        ctx.fillStyle = 'rgba(255,255,255,0.04)';
        ctx.fillRect(x, p.y, p.w, 4);
      }
    }

    function renderHazards(cameraX) {
      for (const h of world.hazards) {
        const x = h.x - cameraX;
        ctx.fillStyle = '#d86d6d';
        for (let i = 0; i < h.w; i += 14) {
          ctx.beginPath();
          ctx.moveTo(x + i, h.y + h.h);
          ctx.lineTo(x + i + 7, h.y + 2);
          ctx.lineTo(x + i + 14, h.y + h.h);
          ctx.closePath();
          ctx.fill();
        }
      }
    }

    function renderOre(cameraX) {
      for (const ore of world.ore) {
        const x = ore.x - cameraX;
        ctx.beginPath();
        ctx.fillStyle = ore.color;
        ctx.arc(x, ore.y, ore.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.strokeStyle = 'rgba(255,255,255,0.4)';
        ctx.lineWidth = 1.2;
        ctx.arc(x, ore.y, ore.r + 2, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    function renderMarks(cameraX) {
      for (const m of world.marks) {
        const x = m.x - cameraX;
        ctx.beginPath();
        ctx.fillStyle = m.color;
        ctx.globalAlpha = clamp(m.life / 72, 0, 1);
        ctx.arc(x, m.y, m.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    function renderParticles(cameraX) {
      for (const p of world.particles) {
        ctx.beginPath();
        ctx.fillStyle = p.color;
        ctx.globalAlpha = clamp(p.life / 50, 0, 1);
        ctx.arc(p.x - cameraX, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    function renderPortal(cameraX) {
      const x = world.portal.x - cameraX;
      const y = world.portal.y;
      const t = Date.now() * 0.008;
      if (!world.portal.active) {
        ctx.fillStyle = 'rgba(124, 201, 255, 0.10)';
        ctx.fillRect(x, y, world.portal.w, world.portal.h);
        ctx.strokeStyle = 'rgba(140, 160, 172, 0.4)';
        ctx.strokeRect(x, y, world.portal.w, world.portal.h);
        return;
      }

      ctx.fillStyle = 'rgba(124, 201, 255, 0.16)';
      ctx.fillRect(x - 12, y - 8, world.portal.w + 24, world.portal.h + 16);
      ctx.strokeStyle = '#7cc9ff';
      ctx.lineWidth = 2;
      ctx.strokeRect(x, y, world.portal.w, world.portal.h);
      ctx.beginPath();
      ctx.fillStyle = '#8fe7bb';
      ctx.arc(x + world.portal.w / 2, y + 62 + Math.sin(t * 2) * 10, 12 + Math.sin(t) * 3, 0, Math.PI * 2);
      ctx.fill();
    }

    function renderPlayer(cameraX) {
      const p = world.player;
      const x = p.x - cameraX;
      const y = p.y;

      ctx.fillStyle = '#edf6ff';
      ctx.fillRect(x + 7, y + 2, 12, 14);
      ctx.fillStyle = '#7cc9ff';
      ctx.fillRect(x + 5, y + 16, 16, 20);
      ctx.fillStyle = '#e3c17c';
      ctx.fillRect(x + 2, y + 32, 8, 12);
      ctx.fillRect(x + 16, y + 32, 8, 12);
      ctx.fillStyle = '#f2b6ca';
      ctx.fillRect(x + 8, y + 8, 10, 6);
      ctx.fillStyle = '#0d1318';
      ctx.fillRect(x + 8, y + 10, 3, 3);
      ctx.fillRect(x + 15, y + 10, 3, 3);
    }

    function render() {
      const cameraX = clamp(world.player.x - canvas.width / 2, 0, world.width - canvas.width);
      world.cameraX += (cameraX - world.cameraX) * 0.12;

      renderBackground(world.cameraX);
      renderCamp(world.cameraX);
      renderPlatforms(world.cameraX);
      renderHazards(world.cameraX);
      renderOre(world.cameraX);
      renderMarks(world.cameraX);
      renderParticles(world.cameraX);
      renderPortal(world.cameraX);
      renderPlayer(world.cameraX);
    }

    function tick() {
      movePlayer();
      updateParticles();
      checkPortal();
      render();
      requestAnimationFrame(tick);
    }

    document.addEventListener('keydown', (event) => {
      const key = event.key.toLowerCase();
      world.keys[key] = true;
      if (key === 'e') mineNearbyOre();
      if (key === 'q') inkBurst();
      if (key === ' ') world.keys[' '] = true;
    });

    document.addEventListener('keyup', (event) => {
      const key = event.key.toLowerCase();
      world.keys[key] = false;
      if (key === ' ') world.keys[' '] = false;
    });

    buildLevel();
    updateHud();
    requestAnimationFrame(tick);
  </script>
</body>
</html>
